<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap');

.wd-root, .wd-root * { box-sizing: border-box; }
.wd-root {
  --bg-deep:#14152e;
  --bg-mid:#1d1f42;
  --glow:#d7ff6e;
  --glow-soft:#eeffb8;
  --pink:#ff93b3;
  --gold:#ffd86b;
  --cream:#f6f1e4;
  --card:#252748;
  --card-border:#3c3e72;
  --muted:#8b8db8;
  font-family:'Quicksand',sans-serif;
  color:var(--cream);
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #2a2c5c 0%, transparent 60%),
    radial-gradient(ellipse 100% 60% at 90% 110%, #2a1f4a 0%, transparent 55%),
    var(--bg-deep);
  border-radius:20px;
  position:relative;
  overflow:hidden;
  min-height:640px;
}

.wd-stars { position:absolute; inset:0; pointer-events:none; z-index:0; }
.wd-star { position:absolute; background:#fff; border-radius:50%; opacity:.5; animation:wdTwinkle 3s ease-in-out infinite; }
@keyframes wdTwinkle { 0%,100%{opacity:.15;} 50%{opacity:.9;} }

.wd-wrap { position:relative; z-index:1; padding:22px 20px 28px; max-width:660px; margin:0 auto; }

.wd-header { text-align:center; margin-bottom:14px; }
.wd-logo { font-family:'Fredoka',sans-serif; font-weight:700; font-size:30px; letter-spacing:.5px;
  color:var(--cream); text-shadow: 0 0 14px rgba(215,255,110,.55), 0 0 34px rgba(215,255,110,.25); margin:0; }
.wd-tagline { font-size:13px; color:var(--muted); margin-top:2px; letter-spacing:.3px; }

.wd-coin-badge { position:absolute; top:18px; right:18px; z-index:5; display:flex; align-items:center; gap:6px;
  background:var(--card); border:1.5px solid var(--card-border); padding:5px 12px 5px 6px; border-radius:999px;
  font-family:'Fredoka',sans-serif; font-weight:600; font-size:13.5px; color:var(--gold);
  box-shadow:0 0 10px -2px rgba(255,216,107,.45); }
.wd-coin-badge .wd-coin-icon { display:block; flex:0 0 auto; }
.wd-coin-badge.low { color:var(--pink); }

.wd-nav { display:flex; justify-content:center; gap:6px; margin:16px 0 18px; }
.wd-nav button {
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:13px; letter-spacing:.2px;
  background:transparent; color:var(--muted); border:1px solid var(--card-border);
  padding:8px 16px; border-radius:999px; cursor:pointer; transition:all .2s ease;
}
.wd-nav button:hover { color:var(--cream); border-color:var(--glow); }
.wd-nav button.active { background:var(--glow); color:#14152e; border-color:var(--glow); box-shadow:0 0 16px rgba(215,255,110,.4); }

.wd-series-row { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:6px; scrollbar-width:thin; }
.wd-series-chip {
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px;
  font-weight:700; font-size:12.5px; cursor:pointer; border:1.5px solid var(--card-border); background:var(--card);
  color:var(--cream); opacity:.75; transition:all .2s ease; white-space:nowrap;
}
.wd-series-chip .dot { width:9px; height:9px; border-radius:50%; }
.wd-series-chip.active { opacity:1; border-color:var(--sc,var(--glow)); box-shadow:0 0 14px var(--sc,var(--glow)); }

.wd-panel-title { font-family:'Fredoka',sans-serif; font-size:17px; font-weight:600; margin:4px 0 12px; display:flex; align-items:center; justify-content:space-between; }
.wd-panel-title small { font-family:'Quicksand',sans-serif; font-weight:600; color:var(--muted); font-size:12.5px; }

.wd-shelf { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.wd-box { position:relative; aspect-ratio:1/1; border-radius:16px; cursor:pointer; user-select:none;
  background:linear-gradient(155deg,var(--sc,var(--glow)) 0%, #17183a 130%);
  border:2px solid rgba(255,255,255,.15); overflow:hidden;
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
}
.wd-box:hover { transform:translateY(-3px); }
.wd-box:active { transform:translateY(0px) scale(.97); }
.wd-box .wd-box-ribbon { position:absolute; inset:0; background:
   linear-gradient(to right, transparent 44%, rgba(255,255,255,.35) 44%, rgba(255,255,255,.35) 56%, transparent 56%),
   linear-gradient(to bottom, transparent 44%, rgba(255,255,255,.35) 44%, rgba(255,255,255,.35) 56%, transparent 56%); }
.wd-box .wd-box-mark { font-family:'Fredoka',sans-serif; font-weight:700; font-size:26px; color:rgba(20,21,46,.55); z-index:1; }
.wd-box.shaking { animation:wdShake .5s ease; }
@keyframes wdShake { 0%,100%{transform:rotate(0);} 15%{transform:rotate(-6deg);} 30%{transform:rotate(6deg);} 45%{transform:rotate(-5deg);} 60%{transform:rotate(5deg);} 75%{transform:rotate(-3deg);} 90%{transform:rotate(3deg);} }
.wd-box.opened { animation:wdPop .35s ease forwards; }
@keyframes wdPop { to { transform:scale(0); opacity:0; } }

.wd-hint { text-align:center; color:var(--muted); font-size:12.5px; margin-top:14px; line-height:1.5; }

.wd-box-price { position:absolute; bottom:6px; right:6px; z-index:2; display:flex; align-items:center; gap:3px;
  background:rgba(20,21,46,.6); color:#fff3c8; font-family:'Fredoka',sans-serif; font-weight:600; font-size:10.5px;
  padding:2px 7px 2px 4px; border-radius:999px; }
.wd-box-price .wd-coin-icon { display:block; flex:0 0 auto; }
.wd-box.unaffordable { opacity:.5; }
.wd-box.unaffordable:hover { transform:none; }

.wd-funds-warn { text-align:center; color:var(--pink); font-weight:700; font-size:12.5px; margin-top:10px;
  opacity:0; transition:opacity .25s ease; }
.wd-funds-warn.show { opacity:1; }

.wd-modal-bg { position:absolute; inset:0; background:rgba(10,10,26,.72); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:20; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.wd-modal-bg.show { opacity:1; pointer-events:auto; }
.wd-modal { background:var(--card); border:1.5px solid var(--card-border); border-radius:22px; padding:26px 24px 22px;
  width:274px; text-align:center; position:relative; transform:scale(.85); transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
.wd-modal-bg.show .wd-modal { transform:scale(1); }

.wd-burst { position:absolute; top:80px; left:50%; transform:translate(-50%,-50%); width:190px; height:190px; pointer-events:none; }
.wd-ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--sc,var(--glow)); opacity:0; }
.wd-modal-bg.show .wd-ring { animation:wdRing 1s ease-out forwards; }
.wd-ring:nth-child(2){ animation-delay:.08s !important; }
.wd-ring:nth-child(3){ animation-delay:.16s !important; }
@keyframes wdRing { 0%{ opacity:.9; transform:scale(.2);} 100%{opacity:0; transform:scale(1.6);} }

.wd-figure-stage { width:140px; height:172px; margin:2px auto 4px; position:relative; opacity:0; transform:scale(.5) translateY(10px); }
.wd-modal-bg.show .wd-figure-stage { animation:wdFigureIn .5s .25s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes wdFigureIn { to { opacity:1; transform:scale(1) translateY(0);} }

.wd-rarity-tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  padding:3px 10px; border-radius:999px; margin-bottom:4px; }
.wd-rarity-tag.common { background:rgba(215,255,110,.15); color:var(--glow); }
.wd-rarity-tag.rare { background:rgba(255,147,179,.18); color:var(--pink); }
.wd-rarity-tag.secret { background:linear-gradient(90deg,#ffd86b,#ffb56b); color:#3a2400; }

.wd-fig-name { font-family:'Fredoka',sans-serif; font-size:18px; font-weight:600; margin:2px 0 1px; }
.wd-fig-series { font-size:11.5px; color:var(--muted); margin-bottom:10px; }
.wd-fig-status { font-size:12.5px; font-weight:700; margin-bottom:14px; }
.wd-fig-status.new { color:var(--glow); }
.wd-fig-status.dup { color:var(--pink); }

.wd-btn { font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; background:var(--glow); color:#14152e;
  border:none; padding:10px 26px; border-radius:999px; cursor:pointer; box-shadow:0 0 16px rgba(215,255,110,.35); }
.wd-btn:hover { filter:brightness(1.06); }
.wd-btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--card-border); box-shadow:none; font-size:12px; padding:7px 16px; }

.wd-progress-wrap { margin-bottom:14px; }
.wd-progress-bar { height:9px; border-radius:999px; background:var(--bg-mid); overflow:hidden; border:1px solid var(--card-border); }
.wd-progress-fill { height:100%; background:linear-gradient(90deg,var(--sc,var(--glow)),var(--glow-soft)); border-radius:999px; transition:width .4s ease; }
.wd-progress-label { font-size:12px; color:var(--muted); margin-top:5px; display:flex; justify-content:space-between; }
.wd-complete-badge { font-size:11.5px; font-weight:700; color:#3a2400; background:linear-gradient(90deg,#ffd86b,#ffb56b); padding:3px 10px; border-radius:999px; margin-left:8px; }

.wd-coll-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.wd-slot { background:var(--card); border:1.5px solid var(--card-border); border-radius:16px; padding:8px 5px 8px; text-align:center; position:relative; }
.wd-slot.owned { border-color:var(--sc,var(--glow)); box-shadow:0 0 14px -4px var(--sc,var(--glow)); }
.wd-slot.rare.owned { border-color:var(--pink); box-shadow:0 0 15px -3px var(--pink); }
.wd-slot.secret.owned { border-color:var(--gold); box-shadow:0 0 16px -2px var(--gold); }
.wd-slot .wd-count { position:absolute; top:5px; right:6px; font-size:10px; font-weight:700; background:rgba(0,0,0,.4); color:var(--cream); padding:1px 5px; border-radius:999px; }
.wd-slot .wd-pip { position:absolute; top:6px; left:7px; width:7px; height:7px; border-radius:50%; }
.wd-slot .wd-pip.rare { background:var(--pink); }
.wd-slot .wd-pip.secret { background:var(--gold); }
.wd-slot .wd-thumb { width:58px; height:72px; margin:0 auto 3px; }
.wd-slot .wd-slot-name { font-size:10px; font-weight:700; line-height:1.2; min-height:18px; display:flex; align-items:center; justify-content:center; }
.wd-slot.locked .wd-slot-name { color:var(--muted); }

.wd-stat-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.wd-stat-card { background:var(--card); border:1.5px solid var(--card-border); border-radius:14px; padding:12px 6px; text-align:center; }
.wd-stat-num { font-family:'Fredoka',sans-serif; font-size:22px; font-weight:600; color:var(--glow); }
.wd-stat-lbl { font-size:10.5px; color:var(--muted); margin-top:2px; }
.wd-series-stat-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:9px 12px; margin-bottom:8px; }
.wd-series-stat-row .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.wd-series-stat-row .name { font-size:12.5px; font-weight:700; width:112px; flex:0 0 auto; }
.wd-series-stat-row .wd-progress-bar { flex:1; }
.wd-series-stat-row .pct { font-size:11px; color:var(--muted); width:34px; text-align:right; flex:0 0 auto; }

.wd-shelf-box { background:var(--card); border:1.5px solid var(--card-border); border-radius:14px; padding:14px; margin-top:12px; }
.wd-shelf-title { font-family:'Fredoka',sans-serif; font-size:14px; margin-bottom:4px; }
.wd-shelf-sub { font-size:11px; color:var(--muted); margin-bottom:11px; }
.wd-shelf-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }

.wd-footer { text-align:center; margin-top:20px; }
.wd-loading { text-align:center; padding:60px 0; color:var(--muted); font-size:13px; }
</style>

<div class="wd-root" id="wdRoot">
  <div class="wd-stars" id="wdStars"></div>
  <div class="wd-coin-badge" id="wdCoinBadge"></div>
  <div class="wd-wrap">
    <div class="wd-header">
      <p class="wd-logo">&#10024; Weirdos</p>
      <p class="wd-tagline">blind box collecting, after dark</p>
    </div>
    <div class="wd-nav" id="wdNav">
      <button data-tab="open" class="active">Open Boxes</button>
      <button data-tab="collection">My Collection</button>
      <button data-tab="stats">Stats</button>
    </div>
    <div id="wdLoading" class="wd-loading">loading your collection...</div>
    <div id="wdMain" style="display:none;"></div>
    <div class="wd-footer">
      <button class="wd-btn ghost" id="wdReset">Reset collection</button>
    </div>
  </div>

  <div class="wd-modal-bg" id="wdModalBg">
    <div class="wd-modal" id="wdModal"></div>
  </div>
</div>

    var r=(n>>16)&255, g=(n>>8)&255, b=n&255;

    g = Math.max(0, Math.min(255, Math.round(g + (pct<0? g*pct : (255-g)*pct))));

    return '#' + h2(r) + h2(g) + h2(b);

      a.push('<rect x="39" y="122" width="13" height="34" rx="6.5" fill="'+shade(main,-0.05)+'" transform="rotate('+p.legL+' 45 128)"/>');

    a.push('<rect x="24" y="66" width="13" height="40" rx="6.5" fill="'+shade(main,-0.05)+'" transform="rotate('+p.armL+' 30 72)"/>');
    a.push('<rect x="73" y="66" width="13" height="40" rx="6.5" fill="'+shade(main,-0.05)+'" transform="rotate('+p.armR+' 80 72)"/>');
    a.push('<circle cx="30" cy="104" r="7" fill="'+skin+'" transform="rotate('+p.armL+' 30 72)"/>');
    a.push('<circle cx="80" cy="104" r="7" fill="'+skin+'" transform="rotate('+p.armR+' 80 72)"/>');

  // ---------- storage ----------
  // window.storage only exists inside the Claude.ai artifact environment.
  // When this file is opened directly (e.g. double-clicked in Chrome), it's
  // undefined, so we detect that and fall back to localStorage, and finally
  // to an in-memory store if even that isn't available (e.g. some file://
  // contexts block it). This keeps loading and reset working everywhere.
  var storageBackend = 'memory';
  var memoryStore = {};
  var memoryCoins = null;

  // ---------- gold coins ----------
  // Coins pay to open boxes now; the same balance is meant to carry over
  // into a future shop tab. Kept in their own storage slot so they can
  // evolve independently of the figure inventory format.
  var coins = 0;
  var coinStorageKey = 'weirdos-coins-v1';
  var STARTING_COINS = 500;
  var BOX_COST = 0;

  function detectStorageBackend(){
    try {
      if (typeof window !== 'undefined' && window.storage &&
          typeof window.storage.get === 'function' && typeof window.storage.set === 'function') {
        return 'claude';
      }
    } catch (e) {}
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('__wd_probe__', '1');
        localStorage.removeItem('__wd_probe__');
        return 'local';
      }
    } catch (e) {}
    return 'memory';
  }

  function cleanInventory(raw){
    var clean = {};
    for (var k in raw) {
      if (FIG_BY_ID[k] && raw[k] > 0) clean[k] = raw[k];
    }
    return clean;
  }

  function loadInventory(){
    storageBackend = detectStorageBackend();
    if (storageBackend === 'claude') {
      return window.storage.get(storageKey, false).then(function(res){
        var raw = (res && res.value) ? JSON.parse(res.value) : {};
        inventory = cleanInventory(raw);
      }).catch(function(){ inventory = {}; });
    }
    if (storageBackend === 'local') {
      try {
        var raw = JSON.parse(localStorage.getItem(storageKey) || '{}');
        inventory = cleanInventory(raw);
      } catch (e) { inventory = {}; }
      return Promise.resolve();
    }
    inventory = memoryStore;
    return Promise.resolve();
  }

  function saveInventory(){
    try {
      if (storageBackend === 'claude') {
        return window.storage.set(storageKey, JSON.stringify(inventory), false).catch(function(){});
      }
      if (storageBackend === 'local') {
        localStorage.setItem(storageKey, JSON.stringify(inventory));
        return Promise.resolve();
      }
      memoryStore = inventory;
      return Promise.resolve();
    } catch (e) {
      return Promise.resolve();
    }
  }

  function loadCoins(){
    // storageBackend is already resolved by loadInventory() before this runs.
    if (storageBackend === 'claude') {
      return window.storage.get(coinStorageKey, false).then(function(res){
        var raw = (res && res.value) ? JSON.parse(res.value) : null;
        coins = (raw && typeof raw.coins === 'number') ? raw.coins : STARTING_COINS;
      }).catch(function(){ coins = STARTING_COINS; });
    }
    if (storageBackend === 'local') {
      try {
        var raw = JSON.parse(localStorage.getItem(coinStorageKey) || 'null');
        coins = (raw && typeof raw.coins === 'number') ? raw.coins : STARTING_COINS;
      } catch (e) { coins = STARTING_COINS; }
      return Promise.resolve();
    }
    coins = (typeof memoryCoins === 'number') ? memoryCoins : STARTING_COINS;
    return Promise.resolve();
  }

  function saveCoins(){
    try {
      if (storageBackend === 'claude') {
        return window.storage.set(coinStorageKey, JSON.stringify({coins:coins}), false).catch(function(){});
      }
      if (storageBackend === 'local') {
        localStorage.setItem(coinStorageKey, JSON.stringify({coins:coins}));
        return Promise.resolve();
      }
      memoryCoins = coins;
      return Promise.resolve();
    } catch (e) {
      return Promise.resolve();
    }
  }

  // ---------- helpers ----------
  function ownedCount(id){ return inventory[id] || 0; }
  function seriesOwnedTotal(s){ return s.figures.filter(function(f){ return ownedCount(f.id) > 0; }).length; }
  function totalUnique(){ var n=0; for (var k in inventory) { if (inventory[k]>0) n++; } return n; }
  function totalOpened(){ var n=0; for (var k in inventory) { n += inventory[k]; } return n; }
  function setsCompleted(){ return SERIES.filter(function(s){ return seriesOwnedTotal(s)===s.figures.length; }).length; }
  function ownedOfRarity(r){
    var n = 0;
    for (var k in inventory) { if (inventory[k] > 0 && FIG_BY_ID[k] && FIG_BY_ID[k].rarity === r) n++; }
    return n;
  }
  function countOfRarity(r){
    var n = 0;
    SERIES.forEach(function(s){ s.figures.forEach(function(f){ if (f.rarity === r) n++; }); });
    return n;
  }

  // commons 78% / rares 17% / secret 5%
  function pickFigure(seriesId){
    var s = SERIES.filter(function(x){ return x.id === seriesId; })[0];
    var commons = s.figures.filter(function(f){ return f.rarity === 'common'; });
    var rares   = s.figures.filter(function(f){ return f.rarity === 'rare'; });
    var secrets = s.figures.filter(function(f){ return f.rarity === 'secret'; });
    var r = Math.random() * 100;
    var pool, span, base;
    if (r < 78)      { pool = commons; base = 0;  span = 78; }
    else if (r < 95) { pool = rares;   base = 78; span = 17; }
    else             { pool = secrets; base = 95; span = 5; }
    var idx = Math.min(pool.length - 1, Math.floor(((r - base) / span) * pool.length));
    return FIG_BY_ID[pool[idx].id];
  }

  // ---------- render ----------
  function seriesChipsHTML(){
    var out = '<div class="wd-series-row">';
    SERIES.forEach(function(sr){
      out += '<div class="wd-series-chip ' + (sr.id===activeSeries?'active':'') + '" style="--sc:'+sr.color+'" data-series="'+sr.id+'">' +
        '<span class="dot" style="background:'+sr.color+'"></span>' + esc(sr.name) + '</div>';
    });
    return out + '</div>';
  }

  function renderOpen(){
    var s = SERIES.filter(function(x){ return x.id===activeSeries; })[0];
    var html = seriesChipsHTML();
    html += '<div class="wd-panel-title">' + esc(s.name) + ' <small>tap a box to open it</small></div>';
    html += '<div class="wd-shelf" style="--sc:'+s.color+'">';
    var afford = coins >= BOX_COST;
    for (var i=0;i<6;i++){
      html += '<div class="wd-box'+(afford?'':' unaffordable')+'" style="--sc:'+s.color+'">' +
        '<div class="wd-box-ribbon"></div><div class="wd-box-mark">?</div>' +
        '<div class="wd-box-price">'+coinIconSVG(12)+BOX_COST+'</div>' +
        '</div>';
    }
    html += '</div>';
    html += '<div class="wd-hint">5 regular Weirdos, 2 rares and 1 golden secret hide in every series.<br>Rares turn up about 1 box in 6, secrets about 1 in 20.</div>';
    html += '<div class="wd-funds-warn" id="wdFundsWarn">Not enough gold coins for that box!</div>';
    return html;
  }

  function slotHTML(f, s){
    var c = ownedCount(f.id);
    var locked = c === 0;
    var pip = (f.rarity !== 'common' && !locked) ? '<div class="wd-pip '+f.rarity+'"></div>' : '';
    return '<div class="wd-slot ' + (locked?'locked':'owned') + ' ' + f.rarity + '" style="--sc:'+s.color+'">' +
      pip +
      (c>0 ? '<div class="wd-count">x'+c+'</div>' : '') +
      '<div class="wd-thumb">' + (locked ? lockedThumb() : figureSVG(FIG_BY_ID[f.id])) + '</div>' +
      '<div class="wd-slot-name">' + (locked ? '?' : esc(f.name)) + '</div>' +
      '</div>';
  }

  function renderCollection(){
    var s = SERIES.filter(function(x){ return x.id===activeSeries; })[0];
    var owned = seriesOwnedTotal(s), total = s.figures.length;
    var complete = owned === total;

    var html = seriesChipsHTML();
    html += '<div class="wd-progress-wrap" style="--sc:'+s.color+'">' +
      '<div class="wd-progress-bar"><div class="wd-progress-fill" style="width:'+((owned/total)*100)+'%"></div></div>' +
      '<div class="wd-progress-label"><span>' + owned + '/' + total + ' collected' +
      (complete ? '<span class="wd-complete-badge">&#10024; Complete Set!</span>' : '') +
      '</span><span>' + esc(s.name) + '</span></div></div>';

    html += '<div class="wd-coll-grid">';
    s.figures.forEach(function(f){ html += slotHTML(f, s); });
    html += '</div>';
    return html;
  }

  function renderStats(){
    var html = '<div class="wd-stat-cards">' +
      '<div class="wd-stat-card"><div class="wd-stat-num">'+totalOpened()+'</div><div class="wd-stat-lbl">boxes opened</div></div>' +
      '<div class="wd-stat-card"><div class="wd-stat-num">'+totalUnique()+'/'+TOTAL_FIGS+'</div><div class="wd-stat-lbl">weirdos found</div></div>' +
      '<div class="wd-stat-card"><div class="wd-stat-num">'+setsCompleted()+'/'+SERIES.length+'</div><div class="wd-stat-lbl">sets complete</div></div>' +
      '</div>';

    html += '<div class="wd-panel-title">Series progress</div>';
    SERIES.forEach(function(s){
      var owned = seriesOwnedTotal(s), total = s.figures.length;
      html += '<div class="wd-series-stat-row" style="--sc:'+s.color+'">' +
        '<span class="dot" style="background:'+s.color+'"></span>' +
        '<span class="name">'+esc(s.name)+'</span>' +
        '<div class="wd-progress-bar"><div class="wd-progress-fill" style="width:'+((owned/total)*100)+'%"></div></div>' +
        '<span class="pct">'+owned+'/'+total+'</span></div>';
    });

    html += '<div class="wd-shelf-box"><div class="wd-shelf-title">&#10024; Golden secrets</div>' +
      '<div class="wd-shelf-sub">'+ownedOfRarity('secret')+' of '+countOfRarity('secret')+' found</div>' +
      '<div class="wd-shelf-grid">';
    SERIES.forEach(function(s){
      s.figures.filter(function(f){ return f.rarity==='secret'; }).forEach(function(f){ html += slotHTML(f, s); });
    });
    html += '</div></div>';

    html += '<div class="wd-shelf-box"><div class="wd-shelf-title">Rare Weirdos</div>' +
      '<div class="wd-shelf-sub">'+ownedOfRarity('rare')+' of '+countOfRarity('rare')+' found</div>' +
      '<div class="wd-shelf-grid">';
    SERIES.forEach(function(s){
      s.figures.filter(function(f){ return f.rarity==='rare'; }).forEach(function(f){ html += slotHTML(f, s); });
    });
    html += '</div></div>';
    return html;
  }

  function render(){
    var main = document.getElementById('wdMain');
    if (activeTab === 'open') main.innerHTML = renderOpen();
    else if (activeTab === 'collection') main.innerHTML = renderCollection();
    else main.innerHTML = renderStats();
    bindDynamic();
  }

  function renderCoinBadge(){
    var el = document.getElementById('wdCoinBadge');
    if (!el) return;
    el.innerHTML = coinIconSVG(20) + '<span>' + coins.toLocaleString() + '</span>';
    el.classList.toggle('low', coins < BOX_COST);
  }

  // dims/undims the boxes already on screen without a full re-render,
  // so mid-animation boxes aren't disturbed when a purchase changes the balance
  function updateBoxAffordability(){
    var boxes = document.querySelectorAll('.wd-box');
    var afford = coins >= BOX_COST;
    for (var i=0;i<boxes.length;i++){
      if (!boxes[i].classList.contains('opened')) boxes[i].classList.toggle('unaffordable', !afford);
    }
  }

  var denyTimer = null;
  function denyOpen(boxEl){
    if (boxEl.classList.contains('shaking')) return;
    boxEl.classList.add('shaking');
    setTimeout(function(){ boxEl.classList.remove('shaking'); }, 500);
    var warn = document.getElementById('wdFundsWarn');
    if (warn) {
      warn.classList.add('show');
      clearTimeout(denyTimer);
      denyTimer = setTimeout(function(){ warn.classList.remove('show'); }, 1800);
    }
  }

  function openBox(boxEl){
    if (boxEl.classList.contains('shaking') || boxEl.classList.contains('opened')) return;
    if (coins < BOX_COST) { denyOpen(boxEl); return; }
    coins -= BOX_COST;
    try { saveCoins(); } catch (e) {}
    renderCoinBadge();
    updateBoxAffordability();
    boxEl.classList.add('shaking');
    setTimeout(function(){
      boxEl.classList.remove('shaking');
      boxEl.classList.add('opened');
      var fig = pickFigure(activeSeries);
      var was = ownedCount(fig.id);
      inventory[fig.id] = was + 1;
      try { saveInventory(); } catch (e) {}
      showReveal(fig, was > 0, was + 1);
      setTimeout(function(){
        boxEl.classList.remove('opened');
        boxEl.style.transform = '';
      }, 400);
    }, 520);
  }

  function showReveal(fig, isDup, newCount){
    var bg = document.getElementById('wdModalBg');
    var modal = document.getElementById('wdModal');
    var color = fig.rarity === 'secret' ? '#ffd86b' : (fig.rarity === 'rare' ? '#ff93b3' : fig.seriesColor);
    modal.style.setProperty('--sc', color);

    var tagText = fig.rarity === 'secret' ? '&#10024; Golden Secret'
                : (fig.rarity === 'rare' ? '&#9733; Rare' : 'Weirdo');
    var status = isDup ? ('Duplicate - you now have ' + newCount + '!') : 'New Weirdo! \uD83C\uDF89';

    modal.innerHTML =
      '<div class="wd-burst" style="--sc:'+color+'"><div class="wd-ring"></div><div class="wd-ring"></div><div class="wd-ring"></div></div>' +
      '<div class="wd-rarity-tag '+fig.rarity+'">'+tagText+'</div>' +
      '<div class="wd-figure-stage">'+figureSVG(fig)+'</div>' +
      '<div class="wd-fig-name">'+esc(fig.name)+'</div>' +
      '<div class="wd-fig-series">'+esc(fig.seriesName)+'</div>' +
      '<div class="wd-fig-status '+(isDup?'dup':'new')+'">'+status+'</div>' +
      '<button class="wd-btn" id="wdRevealClose">Nice!</button>';

    bg.classList.add('show');
    document.getElementById('wdRevealClose').onclick = function(){
      bg.classList.remove('show');
      if (activeTab !== 'open') render();
    };
  }

  function bindDynamic(){
    var chips = document.querySelectorAll('.wd-series-chip');
    for (var i=0;i<chips.length;i++){
      chips[i].onclick = function(){ activeSeries = this.getAttribute('data-series'); render(); };
    }
    var boxes = document.querySelectorAll('.wd-box');
    for (var j=0;j<boxes.length;j++){
      boxes[j].onclick = function(){ openBox(this); };
    }
  }

  document.getElementById('wdNav').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    activeTab = btn.getAttribute('data-tab');
    var nb = document.querySelectorAll('#wdNav button');
    for (var i=0;i<nb.length;i++){ nb[i].classList.toggle('active', nb[i]===btn); }
    render();
  });

  document.getElementById('wdReset').addEventListener('click', function(){
    if (!confirm('Reset your whole collection and gold coins? This cannot be undone.')) return;
    inventory = {};
    coins = STARTING_COINS;
    try { saveInventory(); } catch (e) {}
    try { saveCoins(); } catch (e) {}
    renderCoinBadge();
    render();
  });

  var starsWrap = document.getElementById('wdStars');
  for (var si=0; si<45; si++){
    var st = document.createElement('div');
    st.className = 'wd-star';
    st.style.left = (Math.random()*100)+'%';
    st.style.top = (Math.random()*100)+'%';
    st.style.animationDelay = (Math.random()*3)+'s';
    var sz = (Math.random()>0.85 ? '3px' : '1.5px');
    st.style.width = sz; st.style.height = sz;
    starsWrap.appendChild(st);
  }

  loadInventory().then(function(){ return loadCoins(); }).then(function(){
    document.getElementById('wdLoading').style.display = 'none';
    document.getElementById('wdMain').style.display = 'block';
    renderCoinBadge();
    render();
  });
})();
</script>
